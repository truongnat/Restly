display_name: "UX wireframe"
short_description: "ASCII/HTML wireframes, HTML prototypes, or Figma handoff briefs."
default_prompt: "Use $ux-wireframe with mode=ascii|html|prototype|figma. Write WIREFRAME.md or FIGMA_BRIEF.md in the session."
required_input: "Mode, screens/flow, content fields, design-system notes, optional Figma URL."
required_output: "WIREFRAME.md and/or FIGMA_BRIEF.md; HTML under wireframes/ or prototypes/ when applicable."
note_important: "Do NOT claim frames were drawn in Figma unless confirmed. Do NOT present as final UI."
artifacts:
  WIREFRAME.md:
    required: false
    schema:
      executive_summary: { type: array, required: true }
      mode: { type: string, required: true }
  FIGMA_BRIEF.md:
    required: false
    schema:
      executive_summary: { type: array, required: true }
      frames_to_create: { type: array, required: true }
